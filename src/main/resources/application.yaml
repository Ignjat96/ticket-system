spring:
  application:
    name: ticket-system
  docker:
    compose:
      enabled: false
  jpa:
    show-sql: true
    open-in-view: false
    hibernate:
      ddl-auto: validate
  datasource:
    url: "${DB_URL:jdbc:postgresql://localhost:5432/tickets}"
    username: "${DB_USERNAME:tickets}"
    password: "${DB_PASSWORD:password}"